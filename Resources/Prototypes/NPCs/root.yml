# Specific Root compound tasks being used for NPCs.

# Tries to shoot a target in LOS in range.
- type: htnCompound
  id: TurretCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              # TODO: Non-scuffed
              rangeKey: RangedRange
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: RangedRange
              opaqueKey: true
          operator: !type:GunOperator
            targetKey: Target
            requireLOS: true
            opaqueKey: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

  #  - tasks:
  #      - !type:HTNCompoundTask
  #        task: IdleSpinCompound
          
- type: htnCompound
  id: EnergyTurretCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              # TODO: Non-scuffed
              rangeKey: RangedRange
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: RangedRange
              opaqueKey: true
          operator: !type:GunOperator
            targetKey: Target
            opaqueKey: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

    - tasks:
        - !type:HTNCompoundTask
          task: IdleSpinCompound

- type: htnCompound
  id: SimpleRangedHostileCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: InnateRangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: HealSelf
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyMedicine
      - !type:HTNPrimitiveTask
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          removeKeyOnFinish: false
          targetKey: TargetCoordinates
          pathfindKey: TargetPathfind
      - !type:HTNPrimitiveTask
        operator: !type:SwapToFreeHandOperator
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:TargetInRangePrecondition
            targetKey: Target
            rangeKey: InteractRange
          - !type:KeyExistsPrecondition
            key: Target
        operator: !type:InteractWithOperator
          targetKey: Target
      #do the thing, just interact again?
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:KeyExistsPrecondition
            key: Target
        operator: !type:InteractWithOperator
          targetKey: Target
      #wait x time so that it doesn't idle away
      - !type:HTNPrimitiveTask
        operator: !type:WaitOperator
          key: HealTime
      #drop in hopes of resetting it
      - !type:HTNPrimitiveTask
        operator: !type:SwapToFreeHandOperator
      - !type:HTNPrimitiveTask
        operator: !type:DropOperator
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:NoOperator

- type: htnCompound
  id: ToHealMarkerCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyHealMarker
      
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:CoordinatesNotInRangePrecondition
            targetKey: TargetCoordinates
            rangeKey: FollowRange
          - !type:HurtPrecondition
            minDamage: 65
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          targetKey: TargetCoordinates
          rangeKey: FollowCloseRange
          removeKeyOnFinish: false
      - !type:HTNPrimitiveTask
        operator: !type:SwapToFreeHandOperator
      - !type:HTNPrimitiveTask
        operator: !type:DropOperator

- type: htnCompound
  id: ToAttackMarkerCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyAttackMarker
      
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:CoordinatesNotInRangePrecondition
            targetKey: TargetCoordinates
            rangeKey: AttackRange
          - !type:NotHurtPrecondition
            maxDamage: 20
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          targetKey: TargetCoordinates
          rangeKey: AttackRange
          removeKeyOnFinish: false

- type: htnCompound
  id: ForcedToAttackMarkerCompound #prevent AI wandering this far away
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyAttackMarker
      
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:CoordinatesNotInRangePrecondition
            targetKey: TargetCoordinates
            rangeKey: ForcedAttackRange
          - !type:NotHurtPrecondition
            maxDamage: 30
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          targetKey: TargetCoordinates
          rangeKey: AttackRange
          removeKeyOnFinish: false

- type: htnCompound
  id: LeaderFollowCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: NearbyNPCLeader
      
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:CoordinatesNotInRangePrecondition
            targetKey: TargetCoordinates
            rangeKey: FollowRange
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          targetKey: TargetCoordinates
          rangeKey: FollowCloseRange
          removeKeyOnFinish: false

        #drop our medicine or whatever
      - !type:HTNPrimitiveTask
        operator: !type:SwapToFreeHandOperator
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:TargetInRangePrecondition
            targetKey: Target
            rangeKey: FollowCloseRange
          - !type:KeyExistsPrecondition
            key: Target
        operator: !type:DropOperator

