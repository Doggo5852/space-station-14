#maybe its a good idea to make an autonomous AI

- type: htnCompound
  id: AdvancedHumanoidHostileCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask #follow a leader if able
          task: LeaderFollowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: ToHealMarkerCompound #retreat when hurt
    - tasks:
        - !type:HTNCompoundTask
          task: ForcedToAttackMarkerCompound
    - tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound #shoot bad guy
    - tasks:
        - !type:HTNCompoundTask
          task: ToAttackMarkerCompound
    - tasks:
        - !type:HTNCompoundTask
          task: HealSelf
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompoundDropLeftAfter