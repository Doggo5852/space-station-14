- type: entity
  id: WeaponMechM60D
  name: M60D
  description: "Modified M60, widely used on helicopters, ground vehicles and ships. Removal of the stock and pistol grip makes it impossible to use when detached. Can be fit on: Light, Heavy."
  suffix: Mech Weapon, Gun, Combat, Rifle
  parent: BaseMechWeaponRange
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_uac2
  - type: Gun
    projectileSpeed: 50
    fireRate: 9
    minAngle: 3
    maxAngle: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/m60shot.ogg
  - type: ChamberMagazineAmmoProvider
  - type: Appearance
  - type: Tag
    tags:
    - LightVehicle
    - HeavyVehicle
  - type: AmmoCounter
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - M60BigMag
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

