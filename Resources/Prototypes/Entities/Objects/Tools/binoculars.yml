- type: entity
  name: binoculars
  parent: BaseItem
  id: Binoculars
  description: Used for long-distance surveillance.
  components:
  - type: Sprite
    sprite: Objects/Tools/binoculars.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/binoculars.rsi
    quickEquip: false
    slots:
    - Neck
  - type: Wieldable
  - type: UseDelay
    delay: 1.0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 12
    pvsIncrease: 1.2
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
  - type: StaticPrice
    price: 100


- type: entity
  name: optic
  parent: Binoculars
  id: BinocularVehicle
  description: A powerful optic for long range reconnaissance.
  components:
  - type: Clothing
  - type: Item
    size: Ginormous
  - type: UseDelay
    delay: 5
  - type: EyeCursorOffset
    maxOffset: 20
    pvsIncrease: 1.6
  - type: ClothingSpeedModifier
    walkModifier: 0.01
    sprintModifier: 0.01
  - type: HeldSpeedModifier
