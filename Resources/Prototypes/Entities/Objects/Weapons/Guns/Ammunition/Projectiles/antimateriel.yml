- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: B90mmShellHEATFSBullet
  name: shell (90mm HEAT-FS)
  description: welp, we tried
  components:
  - type: ExplodeOnTrigger
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 2
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 7
    totalIntensity: 100 # 30 damage per tile
    maxTileBreak: 0
    deleteAfterExplosion: false
    repeatable: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: heatfsshellbullet
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 800
        Structural: 600
    penetrationThreshold: 900
    penetrationDamageTypeRequirement:
    - Structural
    - Piercing
  - type: StaminaDamageOnCollide
    damage: 150
