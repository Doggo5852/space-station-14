- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: Bullet25mmShellHEI
  name: shell (25x137mm HEI)
  description: oh shit
  components:
  - type: ExplodeOnTrigger
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Piercing: 2
        Structural: 2
    penetrationThreshold: 750
  - type: StaminaDamageOnCollide
    damage: 20
  - type: Explosive
    explosionType: Default
    maxIntensity: 5
    intensitySlope: 5
    totalIntensity: 10 # 30 damage per tile
    maxTileBreak: 0
    deleteAfterExplosion: false
    repeatable: true
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 1
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: PelletShrapnel
    capacity: 40

