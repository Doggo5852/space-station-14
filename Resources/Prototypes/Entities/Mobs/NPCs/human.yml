- type: entity
  name: civilian
  parent: BaseMobHuman
  id: MobCivilian
  description: A miserable pile of secrets.
  components:
  - type: InputMover
  - type: MobMover
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions:
    - NanoTrasen

- type: entity
  name: salvager
  parent: BaseMobHuman
  id: MobSalvager
  components:
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - SalvageSpecialistGear
    - type: InputMover
    - type: MobMover
    - type: Strippable
      handStripDelay: 0.2
    - type: HTN
      rootTask:
        task: AdvancedHumanoidHostileCompound
      blackboard:
        VisionRadius: !type:Single
          125
        AggroVisionRadius: !type:Single
          125
        MinimumIdleTime: !type:Single
          15
        MaximumIdleTime: !type:Single
          30
        FollowRange: !type:Single
          4
        HealTime: !type:Single
          12
        NavClimb: !type:Bool
          true
        RangedRange: !type:Single
          15

