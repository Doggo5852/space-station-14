  suffix: Dead
  save: false # mobs are currently not saveable.
  id: SalvageHumanCorpse
  name: unidentified corpse
  description: I think they're dead.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Damageable
    damage:
      types:
        Bloodloss: 49
        Asphyxiation: 76
        Slash: 56
        Blunt: 19
  - type: Inventory
    templateId: corpse
  # Begin Offbrand Additions
  - type: BrainDamage
    damage: 100
    oxygen: 0
  - type: Heartrate
    running: false
    damage: 50
  # End Offbrand Additions

